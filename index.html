<!DOCTYPE html> 
<html lang="pt-Br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Aniversário❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!--Tela Inicial -->
    <section id="inicio">
        <div class="presente">
            <div class="laco"></div>
            <div class="tampa"></div>
            <div class="fitaVertical"></div>
        </div>

        <div class="caixa">
            <div class="fitaVertical"></div>
            <div class="fitaHorizontal"></div>
        </div>
    
        <h1>Feliz Aniversário❤️</h1>
        <p> Preparei uma surpresa feita com muito carinho!</p>
        <button id="abrirPresente">
            Abrir Presente 🎁
        </button>
    </section>

    <!-- Caixa de Presente -->
     <section id="presente" class="oculto">
        <div class="presente-aberto">
            <div class="tampa-aberta"></div>
            <div class="caixa-aberta">
                🎁
            </div>
        <button id="abrirCarta">
            Abrir Carta 💌
        </button>
     </section>

     <!-- Carta -->
      <section id="carta" class="oculto">
        <div class="papel">
            <h2>Para meu amor 💌</h2>
            <p id="textoCarta"></p>
        </div>
      </section>

      <!-- Fotos -->
       <section id="fotos" class="oculto">
        <div class="album">
            <h2>Nossos momentos ❤️</h2>
            <img src="imagem/foto1.jpg" id="fotoAtual" alt="Foto do casal">
            <button id="proximaFoto">
                 próxima foto ➡️
            </button>
        </div>
       </section>

       <!-- Contador -->
        <section id="contador" class="oculto">
            <h2>Estamos juntos há</h2>
            <div id="tempo"></div>
        </section>

        <!-- Tela Final -->
         <section id="final" class="oculto">
            <h1>Eu te amo ❤️</h1>
            <p> Feliz aniversário, meu amor!</p> 
         </section>
         
<audio id="musica" loop>
    
    <source src="audio/musica.mp3" type="audio/mpeg">

</audio>


<script src="script.js"></script>   

</body>
</html>
